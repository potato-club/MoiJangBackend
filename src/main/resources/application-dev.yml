# Railway 등 배포 환경용 프로필 (MySQL)
# 활성화: SPRING_PROFILES_ACTIVE=dev
server:
  port: ${PORT:8080}

spring:
  datasource:
    # Railway MySQL을 서비스로 연결하면 MYSQLHOST 등이 자동 주입된다.
    # 직접 넣을 때는 SPRING_DATASOURCE_* 를 쓰면 된다.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

# 쉼표로 구분. 프론트 origin이 확정되면 env CORS_ALLOWED_ORIGINS로 덮어쓸 수 있음
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  invite:
    base-url: ${INVITE_BASE_URL:http://localhost:5173/join}
