spring:
  application:
    name: moi-jang-backend

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: GOOGLE_CLIENT_ID
            client-secret: GOOGLE_CLIENT_SECRET
            scope:
              - profile
              - email

scalar:
  page-title: "Moi Jang API References"
  favicon: "/favicon.ico"

# 로컬 기본 CORS. 프론트 origin 확정 시 조정
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  invite:
    base-url: ${INVITE_BASE_URL:http://localhost:5173/join}
