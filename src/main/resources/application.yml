spring:
  application:
    name: moi-jang-backend

  # 로컬/테스트 기본: H2 인메모리
  # Railway는 SPRING_PROFILES_ACTIVE=dev → application-dev.yml(MySQL) 사용
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  sql:
    init:
      mode: always

  session:
    jdbc:
      initialize-schema: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "{baseUrl}/api/v1/oauth/code/{registrationId}"
            client-id: ${GOOGLE_CLIENT_ID:GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent

logging:
  level:
    org.springframework.security: INFO

server:
  forward-headers-strategy: framework

scalar:
  page-title: "Moi Jang API References"
  favicon: "/api/favicon.ico"
  dark-mode: true

springdoc:
  api-docs:
    path: "/api/v3/api-docs"
  swagger-ui:
    path: "/api/swagger-ui.html"

# 로컬 기본 CORS / 초대 링크
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  invite:
    base-url: ${INVITE_BASE_URL:http://localhost:5173/join}
